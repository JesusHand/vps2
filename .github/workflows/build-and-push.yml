name: Build and Push Docker Image

on:
  push:
    branches: 
      - main
      - master
      - develop
    paths:
      - 'Dockerfile'
      - 'supervisord.conf'
      - '.github/workflows/build-and-push-docker.yml'
  pull_request:
    branches: 
      - main
      - master
  workflow_dispatch:  # دستی trigger کردن

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout Repository
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Extract Metadata
      - name: 📋 Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/vps-1
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Step 5: Build and Push Docker Image
      - name: 🔨 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      # Step 6: Verify Image Push
      - name: ✅ Image Push Verification
        run: |
          echo "✅ Docker Image pushed successfully!"
          echo "📦 Image: ${{ secrets.DOCKER_USERNAME }}/vps-1"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
          echo "🔗 URL: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/vps-1"

      # Step 7: Notify on Success
      - name: 📧 Notify Success
        if: success()
        run: |
          echo "🎉 Docker image built and pushed successfully!"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/vps-1:latest"

      # Step 8: Notify on Failure
      - name: 📧 Notify Failure
        if: failure()
        run: |
          echo "❌ Docker build or push failed!"
          echo "Check the logs above for details."
        continue-on-error: true
